name: Bug Report
description: Raise an issue for something that is stopping CodeCompanion from working as expected
title: "[Bug]: "
labels: ["bug"]

body:
    - type: markdown
      attributes:
        value: |
          **Before opening an issue**, read the [documentation](https://codecompanion.olimorris.dev) and search [existing issues](https://github.com/olimorris/codecompanion.nvim/issues) and [discussions](https://github.com/olimorris/codecompanion.nvim/discussions)

          Feature requests, usage questions and configuration help belong in [Discussions](https://github.com/olimorris/codecompanion.nvim/discussions), not here. Minor cosmetic quirks (spacing, formatting) aren't bugs, please PR those yourself

          > [!IMPORTANT]
          > I'm a solo maintainer and I can only fix what I can reproduce on my own machine. That means a working `minimal.lua`, exact steps, and the actual files you were working on. Issues without these will be closed

    - type: checkboxes
      attributes:
        label: Pre-submission checklist
        options:
          - label: I have read the [documentation](https://codecompanion.olimorris.dev)
            required: true
          - label: I have updated the plugin and all of its dependencies to the latest versions
            required: true
          - label: I have searched for existing [issues](https://github.com/olimorris/codecompanion.nvim/issues) and [discussions](https://github.com/olimorris/codecompanion.nvim/discussions)
            required: true
          - label: If [ACP](https://agentclientprotocol.com) related, I have confirmed that the issue is a CodeCompanion one and not an issue in the adapter itself
            required: true
          - label: My issue is not a minor or cosmetic quirk (e.g. formatting, spacing, or other non-functional details)
            required: true
          - label: I have reproduced this from a clean `minimal.lua` and included everything needed for someone else to hit the same bug
            required: true

    - type: textarea
      attributes:
        label: Environment
        description: Neovim version (`nvim -v`), your OS, and the adapter and model you were using
        placeholder: |
          Neovim: 0.11.2
          OS: macOS 15.1
          Adapter and model: copilot with claude-sonnet-4.5
      validations:
        required: true

    - type: textarea
      attributes:
        label: What happened, and what did you expect?
        description: Describe the problem and include any error messages you saw
        placeholder: |
          When I do X ...
          I observe Y ...
          But I expect Z ...
      validations:
        required: true

    - type: markdown
      attributes:
        value: |
          ## Reproducing the issue

          This is the part that decides whether your issue gets fixed:

          - Download the [`minimal.lua`](https://github.com/olimorris/codecompanion.nvim/blob/main/minimal.lua) file, edit it to include the config that triggers your bug, and run `nvim -u minimal.lua`
          - Plugins are downloaded to a `.repro` folder in your current working directory
          - Confirm the bug still happens there, then paste that exact file below

    - type: textarea
      attributes:
        label: minimal.lua
        description: The exact file you reproduced the bug with. Untested or missing files will get the issue closed
        render: lua
      validations:
        required: true

    - type: textarea
      attributes:
        label: Steps to reproduce
        description: Numbered steps, starting from opening Neovim with your `minimal.lua`. Be precise. Include the prompt you sent to the LLM if there was one
        placeholder: |
          1. Open Neovim with the provided minimal.lua and the example file below
          2. Open a chat buffer with `:CodeCompanionChat`
          3. Send the prompt "..."
          4. ...
      validations:
        required: true

    - type: textarea
      attributes:
        label: Example files
        description: |
          Paste the contents of any file, buffer or selection involved in the bug, or attach them by dragging them into this box
          I can't test a fix against a file I don't have. If the bug genuinely doesn't involve a specific file, write "N/A"
        placeholder: |
          ```python
          def example():
              ...
          ```
      validations:
        required: true

    - type: textarea
      attributes:
        label: Log output (optional)
        description: |
          Share the output from `.repro/state/nvim/codecompanion.log`
          Please redact any sensitive information
      validations:
        required: false

    - type: textarea
      attributes:
        label: Screenshots or recordings (optional)
        description: Especially useful for UI and diffing issues
      validations:
        required: false
